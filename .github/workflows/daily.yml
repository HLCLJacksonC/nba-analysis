name: daily
on:
  schedule:
    # 21:00 Asia/Shanghai, then hourly retries — GitHub drops or delays
    # scheduled runs, and a same-day rerun is a no-op, so retries are free.
    - cron: "0 13,14,15,16,17 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 nba.py
      - run: |
          # noreply form so the commit counts toward the profile contribution
          # graph (github-actions[bot] commits do not) without exposing an email.
          git config user.name "HLCLJacksonC"
          git config user.email "222498107+HLCLJacksonC@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "nba: $(TZ=Asia/Shanghai date +%F) update"
          git push
